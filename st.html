<div id="hatsu-loader" style="padding:20px;color:white;background:#111;border-radius:12px;">
  <h2>Hatsu 前端加载中……</h2>
  <p>如果一直停在这里，请打开控制台查看报错。</p>
</div>

<script>
(async function () {
  window.addEventListener('error', (event) => {
    alert('[st.html Error] ' + (event.error ? event.error.stack || event.error.message : event.message));
  });
  window.addEventListener('unhandledrejection', (event) => {
    alert('[st.html Rejection] ' + String(event.reason?.stack || event.reason?.message || event.reason));
  });

  window.isHatsuLoaderST = true;
  const BASE = 'https://hatsuboshi.vercel.app/';

  function abs(path) {
    return new URL(path, BASE).href;
  }

  function shouldRewriteUrl(url) {
    return url &&
      !url.startsWith('#') &&
      !url.startsWith('data:') &&
      !url.startsWith('blob:') &&
      !/^[a-zA-Z][a-zA-Z\d+\-.]*:/.test(url);
  }

  function showError(err) {
    console.error('[Hatsu ST Loader] 加载失败：', err);
    document.body.innerHTML =
      '<div style="padding:20px;color:#ff6666;background:#111;border-radius:12px;">' +
      '<h2>Hatsu 前端加载失败</h2>' +
      '<p>请打开 F12 控制台查看具体报错。</p>' +
      '<pre style="white-space:pre-wrap;">' + String(err && err.message ? err.message : err) + '</pre>' +
      '</div>';
  }

  try {
    const htmlRes = await fetch(abs('index.html'), { cache: 'no-store' });
    if (!htmlRes.ok) {
      throw new Error('index.html 加载失败：HTTP ' + htmlRes.status);
    }

    const htmlText = await htmlRes.text();
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');

    // 加载远程 CSS
    document.querySelectorAll('[data-hatsu-remote-style]').forEach(el => el.remove());

    const styleLink = document.createElement('link');
    styleLink.rel = 'stylesheet';
    styleLink.href = abs('style.css');
    styleLink.setAttribute('data-hatsu-remote-style', 'true');
    document.head.appendChild(styleLink);

    // 删除 index.html 里原来的 script，避免相对路径错误
    doc.body.querySelectorAll('script').forEach(s => s.remove());

    // 创建全屏覆盖层
    const overlay = document.createElement('div');
    overlay.id = 'hatsu-fullscreen-overlay';

    overlay.innerHTML = `
      <div id="hatsu-fullscreen-toolbar">
        <div id="hatsu-fullscreen-title">Hatsuboshi Produce</div>
        <div id="hatsu-fullscreen-actions">
          <button id="hatsu-real-fullscreen-btn" type="button">浏览器全屏</button>
          <button id="hatsu-close-fullscreen-btn" type="button">关闭</button>
        </div>
      </div>

      <div id="hatsu-fullscreen-content">
        <div id="hatsu-st-page"></div>
      </div>
    `;

    document.body.appendChild(overlay);

    const page = overlay.querySelector('#hatsu-st-page');
    page.innerHTML = doc.body.innerHTML;

    // 修正 HTML 里的 src
    page.querySelectorAll('[src]').forEach(el => {
      const src = el.getAttribute('src');
      if (shouldRewriteUrl(src)) {
        el.setAttribute('src', abs(src));
      }
    });

    // 修正 href，但不动 #icon-star 这种 SVG 内部引用
    page.querySelectorAll('[href]').forEach(el => {
      const href = el.getAttribute('href');
      if (shouldRewriteUrl(href)) {
        el.setAttribute('href', abs(href));
      }
    });

    // 全屏外壳样式：不改你的内部 UI，只让外层覆盖整个酒馆
    const fullStyle = document.createElement('style');
    fullStyle.setAttribute('data-hatsu-fullscreen-style', 'true');
    fullStyle.textContent = `
      #hatsu-fullscreen-overlay {
        position: fixed !important;
        inset: 0 !important;
        z-index: 999999 !important;
        background: #101016 !important;
        color: #242126 !important;
        display: flex !important;
        flex-direction: column !important;
        width: 100vw !important;
        height: 100vh !important;
      }

      #hatsu-fullscreen-toolbar {
        height: 44px !important;
        flex: 0 0 44px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-between !important;
        padding: 0 14px !important;
        background: rgba(20, 20, 26, 0.96) !important;
        color: white !important;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12) !important;
      }

      #hatsu-fullscreen-title {
        font-weight: 700 !important;
        font-size: 14px !important;
        letter-spacing: 0.02em !important;
      }

      #hatsu-fullscreen-actions {
        display: flex !important;
        gap: 8px !important;
      }

      #hatsu-fullscreen-actions button {
        border: 0 !important;
        border-radius: 8px !important;
        padding: 6px 10px !important;
        color: white !important;
        background: rgba(255, 255, 255, 0.16) !important;
        cursor: pointer !important;
        font-size: 13px !important;
      }

      #hatsu-fullscreen-actions button:hover {
        background: rgba(255, 255, 255, 0.26) !important;
      }

      #hatsu-fullscreen-content {
        flex: 1 1 auto !important;
        overflow: auto !important;
        background:
          radial-gradient(circle at 18% 10%, rgba(255, 79, 154, 0.18), transparent 28%),
          radial-gradient(circle at 84% 6%, rgba(38, 169, 244, 0.2), transparent 30%),
          linear-gradient(135deg, #fff7f0 0%, #f2f7ff 48%, #fff6dd 100%) !important;
      }

      #hatsu-st-page {
        width: 1180px !important;
        min-height: calc(100vh - 44px) !important;
        margin: 0 auto !important;
      }

      /* 隐式生成：处于初星学园聊天时，隐藏除第一楼（开场白）外的所有聊天气泡和输入状态 */
      body.hatsuboshi-active .mes[mesid]:not([mesid="0"]) {
        display: none !important;
      }
      body.hatsuboshi-active .writing_indicator {
        display: none !important;
      }
    `;
    document.head.appendChild(fullStyle);

    // 关闭按钮
    document.getElementById('hatsu-close-fullscreen-btn')?.addEventListener('click', () => {
      overlay.remove();
    });

    // 浏览器真正全屏：必须点击按钮才能触发
    document.getElementById('hatsu-real-fullscreen-btn')?.addEventListener('click', async () => {
      try {
        if (!document.fullscreenElement) {
          await overlay.requestFullscreen();
        } else {
          await document.exitFullscreen();
        }
      } catch (err) {
        console.error('[Hatsu] 浏览器全屏失败：', err);
      }
    });

    // 读取 app.js，并修正里面的 ./assets/
    const jsRes = await fetch(abs('app.js'), { cache: 'no-store' });
    if (!jsRes.ok) {
      throw new Error('app.js 加载失败：HTTP ' + jsRes.status);
    }

    let jsText = await jsRes.text();

    jsText = jsText
      .replaceAll('"./assets/', '"' + abs('assets/'))
      .replaceAll("'./assets/", "'" + abs('assets/'))
      .replaceAll('`./assets/', '`' + abs('assets/'));

    const script = document.createElement('script');
    script.textContent = jsText + '\n//# sourceURL=' + abs('app.js');
    page.appendChild(script);

    // 清掉原来的加载提示
    const loader = document.getElementById('hatsu-loader');
    if (loader) loader.remove();

    // ── 初始化内嵌直接桥接服务（如果用户禁用了本地酒馆扩展） ──
    if (!window.__hatsuboshiProduceLoaded) {
      window.__hatsuboshiProduceLoaded = true;
      initInPageBridge();
    }

    async function initInPageBridge() {
      try {
        const [scriptModule, extensionsModule] = await Promise.all([
          import('/script.js'),
          import('/scripts/extensions.js'),
        ]);
        sillyTavernModules = { scriptModule, extensionsModule };

        // 绑定回复桥接
        await bindSillyTavernReplyBridge();

        // 监听前端发来的请求
        window.addEventListener('message', (event) => {
          if (event.origin !== window.location.origin) return;
          const data = event.data || {};
          if (data.source !== 'hatsuboshi-produce') return;

          if (data.type === 'getCharacter') {
            postCharacterToFrame();
          }
          if (data.type === 'sendPrompt') {
            clearReplyCandidateState();
            pendingRequestId = String(data.requestId || '');
            sendPromptToSillyTavern(data.prompt);
          }
          if (data.type === 'saveState') {
            saveChatState(data.state);
          }
        });

        // 立即发送一次角色数据
        postCharacterToFrame();

        // 监听聊天切换事件来同步数据与设置 body class
        const { eventSource, event_types } = await import('/scripts/events.js');
        eventSource.on(event_types.CHAT_CHANGED, () => {
          clearPendingReplyRequest();
          postCharacterToFrame();
          updateInPageHatsuClass();
        });

        updateInPageHatsuClass();
        console.log('[Hatsu ST Loader] 零安装直接桥接（In-page Bridge）启动成功。');
      } catch (err) {
        console.error('[Hatsu ST Loader] 启动直接桥接失败：', err);
      }
    }

    // ── 桥接辅助函数 ──
    const CHAT_STATE_METADATA_KEY = 'hatsuboshi_produce_state_v1';
    let pendingRequestId = '';
    let pendingPromptSentAt = 0;
    let pendingCandidateInFlight = false;
    let pendingCandidateMessageId = -1;
    let pendingReplyRetryTimer = 0;
    let sillyTavernModules = null;

    function getCurrentContextInfo() {
      const context = window.SillyTavern?.getContext?.();
      const characterId = context?.characterId;
      const character = Array.isArray(context?.characters) && Number.isInteger(Number(characterId))
        ? context.characters[Number(characterId)]
        : null;
      const groupId = context?.groupId || context?.groups?.selected || '';
      const chatId = context?.chatId
        || context?.chatMetadata?.chat_id
        || context?.chatMetadata?.file_name
        || context?.chatMetadata?.fileName
        || context?.chatFile
        || 'default-chat';
      const characterName = character?.name || context?.name2 || document.querySelector('#avatar_div .ch_name')?.textContent?.trim() || '';
      const actorScope = groupId
        ? `group-${groupId}`
        : `char-${Number.isInteger(Number(characterId)) ? characterId : characterName.replace(new RegExp("[\\\\/:*?\\\"<>|\\s]+", "g"), '_')}`;
      return {
        character: {
          name: characterName,
          avatar: character?.avatar || character?.avatarFileName || ''
        },
        saveScope: `${actorScope}-chat-${chatId.replace(new RegExp("[\\\\/:*?\\\"<>|\\s]+", "g"), '_')}`
      };
    }

    function updateInPageHatsuClass() {
      const contextInfo = getCurrentContextInfo();
      const characterName = contextInfo.character?.name || '';
      const isHatsu = characterName.includes('初星学园') || characterName.includes('初星') || characterName.includes('Hatsuboshi');
      if (isHatsu) {
        document.body.classList.add('hatsuboshi-active');
      } else {
        document.body.classList.remove('hatsuboshi-active');
      }
    }

    function getSavedChatState() {
      const envelope = sillyTavernModules?.scriptModule?.chat_metadata?.[CHAT_STATE_METADATA_KEY];
      if (!envelope || typeof envelope !== 'object' || Array.isArray(envelope)) return null;
      return envelope.state;
    }

    function saveChatState(state) {
      const metadata = sillyTavernModules?.scriptModule?.chat_metadata;
      if (!metadata) return;
      metadata[CHAT_STATE_METADATA_KEY] = {
        version: 1,
        updatedAt: Date.now(),
        state: JSON.parse(JSON.stringify(state)),
      };
      sillyTavernModules.extensionsModule.saveMetadataDebounced();
    }

    function postCharacterToFrame() {
      const contextInfo = getCurrentContextInfo();
      const savedState = getSavedChatState();
      const payload = {
        source: 'hatsuboshi-produce-host',
        type: 'character',
        character: contextInfo.character,
        saveScope: contextInfo.saveScope,
        hasSavedState: Boolean(savedState),
        savedState,
      };
      window.postMessage(payload, '*');
    }

    function sendPromptToSillyTavern(prompt) {
      const text = String(prompt || '').trim();
      if (!text) return;
      const textarea = document.querySelector('#send_textarea');
      const sendButton = document.querySelector('#send_but');
      if (textarea && sendButton) {
        textarea.value = text;
        textarea.dispatchEvent(new Event('input', { bubbles: true }));
        textarea.dispatchEvent(new Event('change', { bubbles: true }));
        pendingPromptSentAt = Date.now();
        sendButton.click();
      }
    }

    async function bindSillyTavernReplyBridge() {
      try {
        const { eventSource, event_types } = await import('/scripts/events.js');
        
        eventSource.on(event_types.CHARACTER_MESSAGE_RENDERED, (messageId) => {
          sendLatestAiReplyToFrame(messageId, false);
        });

        const handleGenerationEnd = () => {
          const context = window.SillyTavern?.getContext?.();
          const latestMessageId = context?.chat?.length - 1;
          if (latestMessageId >= 0) {
            sendLatestAiReplyToFrame(latestMessageId, true);
          }
        };

        if (event_types.GENERATION_STARTED) {
          eventSource.on(event_types.GENERATION_STARTED, () => {
            clearReplyCandidateState();
          });
        }
        if (event_types.STREAM_TOKEN_RECEIVED) {
          eventSource.on(event_types.STREAM_TOKEN_RECEIVED, () => {
            const context = window.SillyTavern?.getContext?.();
            const latestMessageId = context?.chat?.length - 1;
            if (latestMessageId >= 0) {
              sendLatestAiReplyToFrame(latestMessageId, false);
            }
          });
        }
        if (event_types.GENERATION_STOPPED) {
          eventSource.on(event_types.GENERATION_STOPPED, handleGenerationEnd);
        }
        if (event_types.MESSAGE_RECEIVED) {
          eventSource.on(event_types.MESSAGE_RECEIVED, (messageId) => {
            sendLatestAiReplyToFrame(messageId, true);
          });
        }
      } catch (error) {
        console.warn('[初星直接桥接] 无法绑定角色回复监听。', error);
      }
    }

    function sendLatestAiReplyToFrame(messageId, isFinal = true) {
      if (!pendingRequestId) return;
      collectAndSendAiReply(messageId, isFinal);
    }

    function collectAndSendAiReply(messageId, isFinal = true) {
      if (Number(messageId) === 0) return;
      if (isFinal && pendingCandidateInFlight) return;
      
      const context = window.SillyTavern?.getContext?.();
      const message = context?.chat?.[messageId];
      if (!message || message.is_user) return;

      const swipeIndex = Number.isInteger(message.swipe_id) ? message.swipe_id : 0;
      let rawText = '';
      if (Array.isArray(message.swipes) && message.swipes.length > 0) {
        rawText = String(message.swipes[swipeIndex] || message.swipes[0] || '');
      }
      if (!rawText) {
        rawText = typeof message.mes === 'string' ? message.mes : '';
      }

      const renderedText = document.querySelector(`.mes[mesid="${messageId}"] .mes_text`)?.innerText || '';
      const text = rawText.length > renderedText.length ? rawText : renderedText;

      if (text.trim().length > 0 || isFinal) {
        window.postMessage({
          source: 'hatsuboshi-produce-host',
          type: 'aiReply',
          requestId: pendingRequestId,
          text,
          rawText,
          renderedText,
          isFinal
        }, '*');
        
        if (isFinal) {
          pendingCandidateInFlight = true;
          pendingCandidateMessageId = Number(messageId);
          scheduleReplyRetry(messageId, 2500);
        }
      }
    }

    function scheduleReplyRetry(messageId, delay = 600) {
      if (!pendingRequestId) return;
      if (pendingReplyRetryTimer) window.clearTimeout(pendingReplyRetryTimer);
      pendingReplyRetryTimer = window.setTimeout(() => {
        pendingReplyRetryTimer = 0;
        pendingCandidateInFlight = false;
        collectAndSendAiReply(Number(messageId), true);
      }, delay);
    }

    function clearReplyCandidateState() {
      if (pendingReplyRetryTimer) window.clearTimeout(pendingReplyRetryTimer);
      pendingReplyRetryTimer = 0;
      pendingCandidateInFlight = false;
      pendingCandidateMessageId = -1;
    }

    function clearPendingReplyRequest() {
      clearReplyCandidateState();
      pendingPromptSentAt = 0;
      pendingRequestId = '';
    }
  } catch (err) {
    showError(err);
  }
})();
</script>
